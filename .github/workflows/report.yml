name: WB report

on:
  schedule:
    - cron: "50 * * * *"   # әр сағат :50-де іске қосылады, бот деректі жинап, дәл :00-де жібереді
  workflow_dispatch:
    inputs:
      mode:
        description: "hourly / daily / weekly"
        default: "hourly"

concurrency:
  group: wb-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      # Қаржы есебі қайта-қайта жіберілмеуі үшін күйді сақтаймыз
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: wb-state-${{ github.run_id }}
          restore-keys: wb-state-
      - run: python bot.py ${{ github.event.inputs.mode || 'auto' }}
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COSTS_CSV: ${{ secrets.COSTS_CSV }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: wb-state-${{ github.run_id }}
