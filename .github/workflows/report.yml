name: WB report

on:
  schedule:
    - cron: "7 * * * *"   # әр сағат сайын (UTC), 7-минутта
  workflow_dispatch:
    inputs:
      mode:
        description: "hourly / daily / weekly"
        default: "hourly"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - run: python bot.py ${{ github.event.inputs.mode || 'auto' }}
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
